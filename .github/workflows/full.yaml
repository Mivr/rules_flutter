name: Probe
# Throwaway behaviour probes (iOS coverage stream). Never merged; see the manager's ios_cov_probes.py.
on:
  workflow_dispatch:
    inputs:
      uncached:
        description: Unused; kept so the dispatch command matches full.yaml's
        required: false
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  probes:
    name: Behaviour probes (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          cache-save: false
      - name: Probes
        run: |
          set -u
          fails=0
          probe() {
            name="$1"; dir="$2"; target="$3"; want="$4"
            log="$RUNNER_TEMP/probe-$name.log"
            set +e
            (cd "$dir" && bazel test "$target" --test_output=errors) > "$log" 2>&1
            rc=$?
            set -e
            cat "$log"
            if [ "$want" = pass ]; then
              if [ "$rc" -eq 0 ]; then v=PASS; else v="ERROR-rc$rc"; fi
            else
              case "$rc" in 3) v=DISCRIMINATES ;; 0) v=BLIND ;; *) v="ERROR-rc$rc" ;; esac
            fi
            echo "PROBE-RESULT $name $v"
            case "$v" in PASS|DISCRIMINATES) ;; *) fails=$((fails + 1)) ;; esac
          }
          log="$RUNNER_TEMP/probe-diag-release-snapshot-target.log"
          set +e
          (cd e2e/ios_example && bazel build //:app_release_device //:app_release_plain_device //:app_simulator && for f in $(bazel cquery --output=files //:app_release_device //:app_release_plain_device 2>/dev/null); do if [ -d "$f" ]; then find "$f" -name App -type f; else echo "$f"; fi; done | grep '/App$' | sort -u > "$RUNNER_TEMP/apps.txt" && cat "$RUNNER_TEMP/apps.txt" && while read -r a; do python3 -c "import re,sys; b=open(sys.argv[1],'rb').read(); m=re.search(rb'(product|release|debug)( [a-z0-9_-]+){4,}', b); print('FEATURES', sys.argv[1], m.group(0).decode() if m else None)" "$a"; file "$a"; otool -l "$a" | grep -A5 LC_BUILD_VERSION; done < "$RUNNER_TEMP/apps.txt") > "$log" 2>&1
          rc=$?
          set -e
          cat "$log"
          if [ "$rc" -eq 0 ]; then v=PASS; else v="ERROR-rc$rc"; fi
          echo "PROBE-RESULT diag-release-snapshot-target $v"
          case "$v" in PASS|DISCRIMINATES) ;; *) fails=$((fails + 1)) ;; esac
          echo "PROBE-SUMMARY failures=$fails"
          [ "$fails" -eq 0 ]
