name: Probe
# Throwaway behaviour probes (iOS coverage stream). Never merged; see the manager's ios_cov_probes.py.
on:
  workflow_dispatch:
    inputs:
      uncached:
        description: Unused; kept so the dispatch command matches full.yaml's
        required: false
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  probes:
    name: Behaviour probes (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          cache-save: false
      - name: Keep one output base per workspace
        run: sed -i '' '/^startup --output_base=/d' ~/.bazelrc
      - name: Build the dev tool and put the pinned Dart on PATH
        run: |
          bazel build //tools/dev_tool:flutter_bazel
          d="$(ls -d "$(bazel info output_base)"/external/*flutter+flutter_*/dart-sdk/bin | head -1)"
          "$d/dart" --version
          echo "$d" >> "$GITHUB_PATH"
      - name: Boot an iOS simulator
        run: dart run tools/dev_tool/tool/boot_ios_simulator.dart
      - name: Install the discovery-stream shim
        run: |
          mkdir -p "$RUNNER_TEMP/shim"
          cat > "$RUNNER_TEMP/shim/xcrun" <<'SHIM'
          #!/bin/bash
          # Probe shim: the VM-service discovery `log stream` prints its header and never delivers (what a late attach looks
          # like); every other xcrun call goes to the real one.
          joined="$*"
          if [ "$1" = simctl ] && [ "$2" = spawn ] && [ "$4" = log ] && [ "$5" = stream ] \
             && [[ "$joined" == *"Dart VM service"* ]] && [[ "$joined" != *processImagePath* ]]; then
            echo "$(date -u +%H:%M:%S) $joined" >> "$SHIM_HITS"
            echo 'Filtering the log data using "composedMessage CONTAINS "Observatory" OR composedMessage CONTAINS "Dart VM service""'
            exec sleep 86400
          fi
          exec /usr/bin/xcrun "$@"
          SHIM
          chmod +x "$RUNNER_TEMP/shim/xcrun"
          : > "$RUNNER_TEMP/shim/hits"
      - name: Install the persisted-log shim
        run: |
          mkdir -p "$RUNNER_TEMP/shim2"
          cat > "$RUNNER_TEMP/shim2/xcrun" <<'SHIM2'
          #!/bin/bash
          # Probe shim 2: every `simctl spawn <udid> log show` answers an empty JSON document; all else goes to the real xcrun.
          if [ "$1" = simctl ] && [ "$2" = spawn ] && [ "$4" = log ] && [ "$5" = show ]; then
            echo "$(date -u +%H:%M:%S) $*" >> "$SHIM2_HITS"
            echo '[]'
            exit 0
          fi
          exec /usr/bin/xcrun "$@"
          SHIM2
          chmod +x "$RUNNER_TEMP/shim2/xcrun"
          : > "$RUNNER_TEMP/shim2/hits"
      - name: Probes
        run: |
          set -u
          fails=0
          probe() {
            name="$1"; dir="$2"; target="$3"; want="$4"
            log="$RUNNER_TEMP/probe-$name.log"
            set +e
            (cd "$dir" && bazel test "$target" --test_output=errors) > "$log" 2>&1
            rc=$?
            set -e
            cat "$log"
            if [ "$want" = pass ]; then
              if [ "$rc" -eq 0 ]; then v=PASS; else v="ERROR-rc$rc"; fi
            else
              case "$rc" in 3) v=DISCRIMINATES ;; 0) v=BLIND ;; *) v="ERROR-rc$rc" ;; esac
            fi
            echo "PROBE-RESULT $name $v"
            case "$v" in PASS|DISCRIMINATES) ;; *) fails=$((fails + 1)) ;; esac
          }
          log="$RUNNER_TEMP/probe-stream-never-attaches.log"
          set +e
          (cd . && SHIM_HITS="$RUNNER_TEMP/shim/hits" PATH="$RUNNER_TEMP/shim:$PATH" dart run tools/dev_tool/tool/e2e.dart --require-ran=iOS --name='iOS Simulator e2e (HTTP control channel screenshot captures Flutter UI|hot restart re-registers)' test/e2e/ios_simulator_e2e_test.dart test/e2e/plugin_example_e2e_test.dart && n="$(wc -l < "$RUNNER_TEMP/shim/hits")" && echo "shim hits: $n" && cat "$RUNNER_TEMP/shim/hits" && [ "$n" -ge 2 ]) > "$log" 2>&1
          rc=$?
          set -e
          cat "$log"
          if [ "$rc" -eq 0 ]; then v=PASS; else v="ERROR-rc$rc"; fi
          echo "PROBE-RESULT stream-never-attaches $v"
          case "$v" in PASS|DISCRIMINATES) ;; *) fails=$((fails + 1)) ;; esac
          log="$RUNNER_TEMP/probe-stream-only.log"
          set +e
          (cd . && raw="$RUNNER_TEMP/raw-stream.txt"; : > "$raw"; ( /usr/bin/xcrun simctl spawn booted log stream --style json --predicate 'eventMessage contains "VM service is listening"' 2>&1 | while IFS= read -r l; do printf "%s %s\n" "$(date -u +%H:%M:%S)" "$l"; done ) >> "$raw" & SHIM2_HITS="$RUNNER_TEMP/shim2/hits" PATH="$RUNNER_TEMP/shim2:$PATH" dart run tools/dev_tool/tool/e2e.dart --require-ran=iOS --name='iOS Simulator e2e (HTTP control channel screenshot captures Flutter UI|hot restart re-registers)' test/e2e/ios_simulator_e2e_test.dart test/e2e/plugin_example_e2e_test.dart 2>&1 | tee "$RUNNER_TEMP/stream-only.out"; rc=${PIPESTATUS[0]}; pkill -f "VM service is listening" || true; sleep 2; echo "::group::raw log stream --style json, arrival-stamped (delimiters, messages, pids)"; grep -E '^[0-9:]+ (\[\{|\},\{|\}\]|\}$|\[|\]|  "eventMessage"|  "processID"|Filtering|getpwuid)' "$raw" | cut -c1-160 | head -80; echo "raw lines: $(wc -l < "$raw")"; echo "::endgroup::"; echo "::group::real log show --style json (last 30m, VM service announcements)"; /usr/bin/xcrun simctl spawn booted log show --last 30m --style json --predicate 'eventMessage contains "Dart VM service"' 2>&1 | head -150; echo '::endgroup::'; n="$(wc -l < "$RUNNER_TEMP/shim2/hits")"; echo "shim2 hits: $n"; p="$(sed -nE 's/^e2e: ([0-9]+) passed.*/\1/p' "$RUNNER_TEMP/stream-only.out" | tail -1)"; echo "stream-only: e2e rc=$rc, passed=${p:-0} of 2"; [ "${p:-0}" -ge 1 ] && [ "$n" -ge 2 ]) > "$log" 2>&1
          rc=$?
          set -e
          cat "$log"
          if [ "$rc" -eq 0 ]; then v=PASS; else v="ERROR-rc$rc"; fi
          echo "PROBE-RESULT stream-only $v"
          case "$v" in PASS|DISCRIMINATES) ;; *) fails=$((fails + 1)) ;; esac
          echo "PROBE-SUMMARY failures=$fails"
          [ "$fails" -eq 0 ]
