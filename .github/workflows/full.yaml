name: Probe
# Throwaway behaviour probes (iOS coverage stream). Never merged; see the manager's ios_cov_probes.py.
on:
  workflow_dispatch:
    inputs:
      uncached:
        description: Unused; kept so the dispatch command matches full.yaml's
        required: false
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  probes:
    name: Behaviour probes (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          cache-save: false
      - name: Probes
        run: |
          set -u
          fails=0
          probe() {
            name="$1"; dir="$2"; target="$3"; want="$4"
            log="$RUNNER_TEMP/probe-$name.log"
            set +e
            (cd "$dir" && bazel test "$target" --test_output=errors) > "$log" 2>&1
            rc=$?
            set -e
            cat "$log"
            if [ "$want" = pass ]; then
              if [ "$rc" -eq 0 ]; then v=PASS; else v="ERROR-rc$rc"; fi
            else
              case "$rc" in 3) v=DISCRIMINATES ;; 0) v=BLIND ;; *) v="ERROR-rc$rc" ;; esac
            fi
            echo "PROBE-RESULT $name $v"
            case "$v" in PASS|DISCRIMINATES) ;; *) fails=$((fails + 1)) ;; esac
          }
          probe control-plugin-spm e2e/integration_ios //:plugin_spm_test pass
          echo '::group::mutate bigint-5.3.0'
          if (cd e2e/integration_ios && python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path("ios/Runner.xcworkspace/xcshareddata/swiftpm/Package.resolved"); s = p.read_text()
          n = s.replace("63feef7820abb1a8fb08587d7da56bb0b7db8751", "0ed110f7555c34ff468e72e1686e59721f2b0da6").replace('"6.0.1"', '"5.3.0"')
          assert n != s, "no bigint revision"; p.write_text(n)
          m = pathlib.Path("MODULE.bazel"); t = m.read_text()
          u = t.replace("55fc8a63f655a09d9216f2c9bc062c508f98d4eca4b8ebefaf295a3ea4ac8f22", "e33aa3e2c23738ecced5ba2b292543f14a952329abc27d55bcf44cc9d0e15492")
          assert u != t, "no bigint sha"; m.write_text(u)
          PY
          ); then
            echo '::endgroup::'
            probe bigint-5.3.0 e2e/integration_ios //:plugin_spm_test fail
          else
            echo '::endgroup::'
            echo 'PROBE-RESULT bigint-5.3.0 ERROR-mutation-not-applied'; fails=$((fails + 1))
          fi
          git checkout -- e2e/integration_ios
          echo "PROBE-SUMMARY failures=$fails"
          [ "$fails" -eq 0 ]
