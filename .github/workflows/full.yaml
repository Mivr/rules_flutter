name: Full
# Throwaway diagnostic run for the dev-tool-ios lane (iOS coverage stream). Never merged.
# Same steps as full.yaml's dev-tool-ios job, plus: DIAG lines from the dev tool, each dev tool's full
# stdout/stderr, an independent long-lived discovery-predicate log stream, app-process logs, a 60 s
# sampler (load, memory, app processes, downscaled screenshot), `log show` after the suite, and a
# discovery-stream attach experiment (stream then launch at once, vs stream, 5 s, launch).
on:
  workflow_dispatch:
    inputs:
      uncached:
        description: Unused; kept so the dispatch command matches full.yaml's
        required: false
        default: false
        type: boolean
permissions:
  contents: read
env:
  BAZEL_REPOSITORY_CACHE_KEY_FILES: |
    - MODULE.bazel
    - MODULE.bazel.lock
    - e2e/*/MODULE.bazel
    - flutter/private/versions.bzl
jobs:
  dev-tool-ios:
    name: Dev tool iOS diag (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          repository-cache: ${{ env.BAZEL_REPOSITORY_CACHE_KEY_FILES }}
          cache-save: false
      - name: Keep one output base per workspace
        run: sed -i '' '/^startup --output_base=/d' ~/.bazelrc
      - name: Build the dev tool and put the pinned Dart on PATH
        run: |
          bazel build //tools/dev_tool:flutter_bazel
          dart_bin="$(ls -d "$(bazel info output_base)"/external/*flutter+flutter_*/dart-sdk/bin | head -1)"
          echo "$dart_bin" >> "$GITHUB_PATH"
          export PATH="$dart_bin:$PATH"
          dart --version
      - name: Boot an iOS simulator
        run: dart run tools/dev_tool/tool/boot_ios_simulator.dart
      - name: Dev tool iOS simulator e2e (instrumented)
        run: |
          set -u
          D="$RUNNER_TEMP/diag"; mkdir -p "$D/devtool" "$D/shots"
          export E2E_DIAG_DIR="$D/devtool"
          UDID="$(xcrun simctl list devices booted -j | python3 -c 'import json,sys; print([d["udid"] for v in json.load(sys.stdin)["devices"].values() for d in v][0])')"
          echo "$UDID" > "$D/udid.txt"; echo "UDID=$UDID"
          sysctl -n hw.ncpu hw.memsize > "$D/host.txt"; sw_vers >> "$D/host.txt"; xcodebuild -version >> "$D/host.txt"
          ts() { perl -MTime::HiRes=time -MPOSIX=strftime -ne 'BEGIN{$|=1} my $t=time; printf "%s.%03dZ %s", strftime("%H:%M:%S",gmtime($t)), ($t-int($t))*1000, $_'; }
          xcrun simctl spawn "$UDID" log stream --predicate 'eventMessage contains "Observatory" or eventMessage contains "Dart VM service"' 2>&1 | ts > "$D/observer-announce.log" &
          xcrun simctl spawn "$UDID" log stream --level info --predicate 'processImagePath CONTAINS "/Containers/Bundle/Application/" OR eventMessage CONTAINS "com.rulesflutter" OR eventMessage CONTAINS "com.example.plugin"' 2>&1 | ts > "$D/observer-apps.log" &
          ( while true; do
              { echo "=== $(date -u +%H:%M:%S)Z load=$(sysctl -n vm.loadavg)"; memory_pressure -Q 2>/dev/null | tail -1; vm_stat | grep -E 'free|active|wired|compressor|Swapouts'; sysctl -n vm.swapusage; ps -axo pid,etime,time,pcpu,rss,stat,command | grep -E 'Containers/Bundle/Application|log stream' | grep -v grep | cut -c1-230; } >> "$D/sampler.log" 2>&1
              s="$D/shots/$(date -u +%H%M%S).png"; xcrun simctl io "$UDID" screenshot "$s" > /dev/null 2>&1 && sips -Z 480 "$s" > /dev/null 2>&1
              sleep 60
            done ) &
          set +e
          dart run tools/dev_tool/tool/e2e.dart --require-ran=iOS --name=iOS test/e2e/ios_simulator_e2e_test.dart test/e2e/asset_reload_e2e_test.dart test/e2e/plugin_example_e2e_test.dart
          rc=$?
          echo "E2E_RC=$rc" | tee "$D/e2e_rc.txt"
          xcrun simctl spawn "$UDID" log show --last 150m --info --predicate 'eventMessage contains "Observatory" or eventMessage contains "Dart VM service"' > "$D/logshow-announce.log" 2>&1
          xcrun simctl spawn "$UDID" log show --last 150m --info --predicate 'processImagePath CONTAINS "/Containers/Bundle/Application/" OR eventMessage CONTAINS "com.rulesflutter" OR eventMessage CONTAINS "com.example.plugin"' > "$D/logshow-apps.log" 2>&1
          ls -la ~/Library/Logs/DiagnosticReports/ > "$D/crash-list.txt" 2>&1
          mkdir -p "$D/crash"; cp ~/Library/Logs/DiagnosticReports/*.ips "$D/crash/" 2>/dev/null
          echo "observer announcements: $(grep -c 'listening on' "$D/observer-announce.log")"
          grep -h 'DIAG' "$D"/devtool/*.log | sort -k4 | grep -E 'sim.launch|vm.connect|vm.first_frame|vm.isolate_|vm.socket' | cut -c1-260
          exit 0
      - name: Discovery-stream attach experiment
        if: always()
        run: |
          set -u
          D="$RUNNER_TEMP/diag"; mkdir -p "$D/loop"; UDID="$(cat "$D/udid.txt")"
          ts() { perl -MTime::HiRes=time -MPOSIX=strftime -ne 'BEGIN{$|=1} my $t=time; printf "%s.%03dZ %s", strftime("%H:%M:%S",gmtime($t)), ($t-int($t))*1000, $_'; }
          now() { perl -MTime::HiRes=time -MPOSIX=strftime -e 'my $t=time; printf "%s.%03dZ", strftime("%H:%M:%S",gmtime($t)), ($t-int($t))*1000'; }
          cd e2e/ios_example
          timeout 1800 bazel build :app -c dbg --ios_multi_cpus=sim_arm64 || { echo "loop app build failed"; exit 0; }
          out="$(bazel cquery :app -c dbg --ios_multi_cpus=sim_arm64 --output=files 2>/dev/null | grep -E '\.(ipa|app)$' | head -1)"
          echo "built: $out"
          case "$out" in
            *.ipa) rm -rf "$D/loopapp"; mkdir -p "$D/loopapp"; unzip -q "$out" -d "$D/loopapp"; APP="$(ls -d "$D"/loopapp/Payload/*.app | head -1)" ;;
            *) APP="$out" ;;
          esac
          BUNDLE="$(plutil -extract CFBundleIdentifier raw "$APP/Info.plist")"
          echo "app=$APP bundle=$BUNDLE"
          xcrun simctl install "$UDID" "$APP" || { echo "install failed"; exit 0; }
          for i in $(seq 1 24); do
            mode=immediate; [ $((i % 2)) -eq 0 ] && mode=delay5
            xcrun simctl terminate "$UDID" "$BUNDLE" > /dev/null 2>&1; sleep 2
            f="$D/loop/$i.log"
            t0="$(now)"
            xcrun simctl spawn "$UDID" log stream --predicate "eventMessage contains \"Observatory\" or eventMessage contains \"Dart VM service\" or eventMessage contains \"LOOPMARK$i\"" 2>&1 | ts > "$f" &
            [ "$mode" = delay5 ] && sleep 5
            t1="$(now)"; lo="$(xcrun simctl launch "$UDID" "$BUNDLE" 2>&1)"; t2="$(now)"
            k=0; while [ $k -lt 60 ] && ! grep -q 'listening on' "$f"; do sleep 0.5; k=$((k + 1)); done
            t3="$(now)"
            hit="$(grep -c 'listening on' "$f")"; hdr="$(grep -m1 'Filtering' "$f" | cut -c1-13)"; ann="$(grep -m1 'listening on' "$f" | cut -c1-13)"
            echo "LOOP i=$i mode=$mode stream=$t0 launch=$t1..$t2 hdr=$hdr ann=$ann found=$hit waited_until=$t3 launch_out=$lo" | tee -a "$D/loop.txt"
            pkill -f "LOOPMARK$i" || true
          done
          xcrun simctl spawn "$UDID" log show --last 20m --info --predicate 'eventMessage contains "Dart VM service"' > "$D/logshow-loop.log" 2>&1
          echo "loop misses: $(grep -c 'found=0' "$D/loop.txt") of $(grep -c '^LOOP' "$D/loop.txt")"
          exit 0
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lane-diag
          path: ${{ runner.temp }}/diag
          retention-days: 1
      - name: Fail if the suite failed
        if: always()
        run: |
          rc="$(sed -n 's/^E2E_RC=//p' "$RUNNER_TEMP/diag/e2e_rc.txt" 2>/dev/null)"
          echo "e2e rc=${rc:-missing}"
          [ "${rc:-1}" = 0 ]
