name: Probe
# Throwaway behaviour probes (iOS coverage stream). Never merged; see the manager's ios_cov_probes.py.
on:
  workflow_dispatch:
    inputs:
      uncached:
        description: Unused; kept so the dispatch command matches full.yaml's
        required: false
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  probes:
    name: Behaviour probes (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          cache-save: false
      - name: Probes
        run: |
          set -u
          fails=0
          probe() {
            name="$1"; dir="$2"; target="$3"; want="$4"
            log="$RUNNER_TEMP/probe-$name.log"
            set +e
            (cd "$dir" && bazel test "$target" --test_output=errors) > "$log" 2>&1
            rc=$?
            set -e
            cat "$log"
            if [ "$want" = pass ]; then
              if [ "$rc" -eq 0 ]; then v=PASS; else v="ERROR-rc$rc"; fi
            else
              case "$rc" in 3) v=DISCRIMINATES ;; 0) v=BLIND ;; *) v="ERROR-rc$rc" ;; esac
            fi
            echo "PROBE-RESULT $name $v"
            case "$v" in PASS|DISCRIMINATES) ;; *) fails=$((fails + 1)) ;; esac
          }
          probe control-ios-bundle e2e/hello_world //:verify_ios_bundle_contents_test pass
          echo '::group::mutate version-2.3.5'
          if (cd e2e/hello_world && python3 - <<'PY'
          import re
          t = open("BUILD.bazel").read()
          m = re.search(r'apple_bundle_version\(\n    name = "hello_world_ios_app_version",\n.*?\n\)\n', t, re.S)
          assert m, "no hello_world_ios_app_version call"
          new = m.group(0).replace('short_version_string = "2.3.4"', 'short_version_string = "2.3.5"')
          assert new != m.group(0), "no 2.3.4 short version"
          open("BUILD.bazel", "w").write(t[:m.start()] + new + t[m.end():])
          PY
          ); then
            echo '::endgroup::'
            probe version-2.3.5 e2e/hello_world //:verify_ios_bundle_contents_test fail
          else
            echo '::endgroup::'
            echo 'PROBE-RESULT version-2.3.5 ERROR-mutation-not-applied'; fails=$((fails + 1))
          fi
          git checkout -- e2e/hello_world
          echo '::group::mutate drop-platform-assets'
          if (cd e2e/hello_world && python3 - <<'PY'
          import re
          t = open("BUILD.bazel").read()
          m = re.search(r'flutter_application\(\n    name = "hello_world_app",\n.*?\n\)\n', t, re.S)
          assert m, "no hello_world_app call"
          blk = m.group(0)
          def drop(dep):
              new = re.sub(r'\n\s+"' + re.escape(dep) + r'",', "", blk, count=1)
              assert new != blk, "no " + dep + " in hello_world_app"
              open("BUILD.bazel", "w").write(t[:m.start()] + new + t[m.end():])
          drop("@deps//:platform_assets")
          PY
          ); then
            echo '::endgroup::'
            probe drop-platform-assets e2e/hello_world //:verify_ios_bundle_contents_test fail
          else
            echo '::endgroup::'
            echo 'PROBE-RESULT drop-platform-assets ERROR-mutation-not-applied'; fails=$((fails + 1))
          fi
          git checkout -- e2e/hello_world
          echo '::group::mutate android-only-unconditional'
          if (cd e2e/hello_world && python3 - <<'PY'
          p = "platform_assets/pubspec.yaml"
          t = open(p).read()
          def swap(old, new):
              assert t.count(old) == 1, "pubspec shape changed: " + old
              open(p, "w").write(t.replace(old, new))
          swap("    - path: assets/android_only.txt\n      platforms:\n        - android\n", "    - assets/android_only.txt\n")
          PY
          ); then
            echo '::endgroup::'
            probe android-only-unconditional e2e/hello_world //:verify_ios_bundle_contents_test fail
          else
            echo '::endgroup::'
            echo 'PROBE-RESULT android-only-unconditional ERROR-mutation-not-applied'; fails=$((fails + 1))
          fi
          git checkout -- e2e/hello_world
          echo '::group::mutate drop-cupertino-icons'
          if (cd e2e/hello_world && python3 - <<'PY'
          import re
          t = open("BUILD.bazel").read()
          m = re.search(r'flutter_application\(\n    name = "hello_world_app",\n.*?\n\)\n', t, re.S)
          assert m, "no hello_world_app call"
          blk = m.group(0)
          def drop(dep):
              new = re.sub(r'\n\s+"' + re.escape(dep) + r'",', "", blk, count=1)
              assert new != blk, "no " + dep + " in hello_world_app"
              open("BUILD.bazel", "w").write(t[:m.start()] + new + t[m.end():])
          drop("@deps//:cupertino_icons")
          PY
          ); then
            echo '::endgroup::'
            probe drop-cupertino-icons e2e/hello_world //:verify_ios_bundle_contents_test fail
          else
            echo '::endgroup::'
            echo 'PROBE-RESULT drop-cupertino-icons ERROR-mutation-not-applied'; fails=$((fails + 1))
          fi
          git checkout -- e2e/hello_world
          echo '::group::mutate ios-only-retargeted'
          if (cd e2e/hello_world && python3 - <<'PY'
          import re
          p = "platform_assets/pubspec.yaml"
          t = open(p).read()
          new, n = re.subn(r"(- path: assets/ios_only\.txt\n\s+platforms:\s*(?:\n\s+- |\[\s*))ios", r"\1android", t)
          assert n == 1, "no ios_only.txt entry with platforms ios"
          open(p, "w").write(new)
          PY
          ); then
            echo '::endgroup::'
            probe ios-only-retargeted e2e/hello_world //:verify_ios_bundle_contents_test fail
          else
            echo '::endgroup::'
            echo 'PROBE-RESULT ios-only-retargeted ERROR-mutation-not-applied'; fails=$((fails + 1))
          fi
          git checkout -- e2e/hello_world
          echo "PROBE-SUMMARY failures=$fails"
          [ "$fails" -eq 0 ]
