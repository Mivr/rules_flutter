name: Probe
# Throwaway behaviour probes (iOS coverage stream). Never merged; see the manager's ios_cov_probes.py.
on:
  workflow_dispatch:
    inputs:
      uncached:
        description: Unused; kept so the dispatch command matches full.yaml's
        required: false
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  probes:
    name: Behaviour probes (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          cache-save: false
      - name: Keep one output base per workspace
        run: sed -i '' '/^startup --output_base=/d' ~/.bazelrc
      - name: Build the dev tool and put the pinned Dart on PATH
        run: |
          bazel build //tools/dev_tool:flutter_bazel
          d="$(ls -d "$(bazel info output_base)"/external/*flutter+flutter_*/dart-sdk/bin | head -1)"
          "$d/dart" --version
          echo "$d" >> "$GITHUB_PATH"
      - name: Boot an iOS simulator
        run: dart run tools/dev_tool/tool/boot_ios_simulator.dart
      - name: Install the discovery-stream shim
        run: |
          mkdir -p "$RUNNER_TEMP/shim"
          cat > "$RUNNER_TEMP/shim/xcrun" <<'SHIM'
          #!/bin/bash
          # Probe shim: the VM-service discovery `log stream` prints its header and never delivers (what a late attach looks
          # like); every other xcrun call goes to the real one.
          joined="$*"
          if [ "$1" = simctl ] && [ "$2" = spawn ] && [ "$4" = log ] && [ "$5" = stream ] \
             && [[ "$joined" == *"Dart VM service"* ]] && [[ "$joined" != *processImagePath* ]]; then
            echo "$(date -u +%H:%M:%S) $joined" >> "$SHIM_HITS"
            echo 'Filtering the log data using "composedMessage CONTAINS "Observatory" OR composedMessage CONTAINS "Dart VM service""'
            exec sleep 86400
          fi
          exec /usr/bin/xcrun "$@"
          SHIM
          chmod +x "$RUNNER_TEMP/shim/xcrun"
          : > "$RUNNER_TEMP/shim/hits"
      - name: Probes
        run: |
          set -u
          fails=0
          probe() {
            name="$1"; dir="$2"; target="$3"; want="$4"
            log="$RUNNER_TEMP/probe-$name.log"
            set +e
            (cd "$dir" && bazel test "$target" --test_output=errors) > "$log" 2>&1
            rc=$?
            set -e
            cat "$log"
            if [ "$want" = pass ]; then
              if [ "$rc" -eq 0 ]; then v=PASS; else v="ERROR-rc$rc"; fi
            else
              case "$rc" in 3) v=DISCRIMINATES ;; 0) v=BLIND ;; *) v="ERROR-rc$rc" ;; esac
            fi
            echo "PROBE-RESULT $name $v"
            case "$v" in PASS|DISCRIMINATES) ;; *) fails=$((fails + 1)) ;; esac
          }
          log="$RUNNER_TEMP/probe-stream-never-attaches.log"
          set +e
          (cd . && SHIM_HITS="$RUNNER_TEMP/shim/hits" PATH="$RUNNER_TEMP/shim:$PATH" dart run tools/dev_tool/tool/e2e.dart --require-ran=iOS --name='iOS Simulator e2e (HTTP control channel screenshot captures Flutter UI|hot restart re-registers)' test/e2e/ios_simulator_e2e_test.dart test/e2e/plugin_example_e2e_test.dart && n="$(wc -l < "$RUNNER_TEMP/shim/hits")" && echo "shim hits: $n" && cat "$RUNNER_TEMP/shim/hits" && [ "$n" -ge 2 ]) > "$log" 2>&1
          rc=$?
          set -e
          cat "$log"
          if [ "$rc" -eq 0 ]; then v=PASS; else v="ERROR-rc$rc"; fi
          echo "PROBE-RESULT stream-never-attaches $v"
          case "$v" in PASS|DISCRIMINATES) ;; *) fails=$((fails + 1)) ;; esac
          echo "PROBE-SUMMARY failures=$fails"
          [ "$fails" -eq 0 ]
