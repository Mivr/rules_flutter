name: Probe
# Throwaway behaviour probes (iOS coverage stream). Never merged; see the manager's ios_cov_probes.py.
on:
  workflow_dispatch:
    inputs:
      uncached:
        description: Unused; kept so the dispatch command matches full.yaml's
        required: false
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  probes:
    name: Behaviour probes (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          cache-save: false
      - name: Probes
        run: |
          set -u
          fails=0
          probe() {
            name="$1"; dir="$2"; target="$3"; want="$4"
            log="$RUNNER_TEMP/probe-$name.log"
            set +e
            (cd "$dir" && bazel test "$target" --test_output=errors) > "$log" 2>&1
            rc=$?
            set -e
            cat "$log"
            if [ "$want" = pass ]; then
              if [ "$rc" -eq 0 ]; then v=PASS; else v="ERROR-rc$rc"; fi
            else
              case "$rc" in 3) v=DISCRIMINATES ;; 0) v=BLIND ;; *) v="ERROR-rc$rc" ;; esac
            fi
            echo "PROBE-RESULT $name $v"
            case "$v" in PASS|DISCRIMINATES) ;; *) fails=$((fails + 1)) ;; esac
          }
          probe control-release-framework e2e/ios_example //:verify_ios_release_framework_test pass
          log="$RUNNER_TEMP/probe-release-symtab-nm.log"
          set +e
          (cd e2e/ios_example && bazel build //:app_release_device //:app_release_plain_device && OB="$(bazel info output_path)" && bad=0 && for t in __app_release_framework_framework __app_release_plain_framework_framework; do
            a="$(find -L "$OB" -path "*/$t/App.framework/App" -type f | head -1)"
            if [ -z "$a" ]; then echo "NM-FAIL no App.framework/App for $t under $OB"; bad=1; continue; fi
            loc="$(nm -a "$a" | awk '{t = (NF >= 3) ? $2 : $1} t !~ /^[A-Z]$/ {n++} END {print n + 0}')"
            exp="$(nm -gU "$a" | awk '{print $NF}' | sort | tr '\n' ' ')"
            my="$(nm -a "$a" | awk '/MyApp/ {n++} END {print n + 0}')"
            echo "NM $t locals_or_stabs=$loc exports=[$exp] myapp_symbols=$my"
            [ "$loc" = 0 ] || bad=1
            [ "$exp" = "_kDartSnapshotData _kDartSnapshotText " ] || bad=1
            if [ "$t" = __app_release_framework_framework ] && [ "$my" != 0 ]; then bad=1; fi
          done && [ "$bad" = 0 ]) > "$log" 2>&1
          rc=$?
          set -e
          cat "$log"
          if [ "$rc" -eq 0 ]; then v=PASS; else v="ERROR-rc$rc"; fi
          echo "PROBE-RESULT release-symtab-nm $v"
          case "$v" in PASS|DISCRIMINATES) ;; *) fails=$((fails + 1)) ;; esac
          echo '::group::mutate release-not-obfuscated'
          if (cd e2e/ios_example && python3 - <<'PY'
          import re
          t = open("BUILD.bazel").read()
          m = re.search(r'flutter_application\(\n    name = "app_flutter_release",\n.*?\n\)\n', t, re.S)
          assert m, "no app_flutter_release call"
          blk = m.group(0)
          def put(attr, value):
              global blk
              new, n = re.subn(r"\n    " + attr + r" = [^\n]*,", "\n    " + attr + " = " + value + ",", blk, count=1)
              assert n == 1, "no " + attr + " on app_flutter_release"
              blk = new
          put("obfuscate", "False")
          open("BUILD.bazel", "w").write(t[:m.start()] + blk + t[m.end():])
          PY
          ); then
            echo '::endgroup::'
            probe release-not-obfuscated e2e/ios_example //:verify_ios_release_framework_test fail
          else
            echo '::endgroup::'
            echo 'PROBE-RESULT release-not-obfuscated ERROR-mutation-not-applied'; fails=$((fails + 1))
          fi
          git checkout -- e2e/ios_example
          echo '::group::mutate no-split-debug-info'
          if (cd e2e/ios_example && python3 - <<'PY'
          import re
          t = open("BUILD.bazel").read()
          m = re.search(r'flutter_application\(\n    name = "app_flutter_release",\n.*?\n\)\n', t, re.S)
          assert m, "no app_flutter_release call"
          blk = m.group(0)
          def put(attr, value):
              global blk
              new, n = re.subn(r"\n    " + attr + r" = [^\n]*,", "\n    " + attr + " = " + value + ",", blk, count=1)
              assert n == 1, "no " + attr + " on app_flutter_release"
              blk = new
          put("split_debug_info", "False")
          open("BUILD.bazel", "w").write(t[:m.start()] + blk + t[m.end():])
          PY
          ); then
            echo '::endgroup::'
            probe no-split-debug-info e2e/ios_example //:verify_ios_release_framework_test fail
          else
            echo '::endgroup::'
            echo 'PROBE-RESULT no-split-debug-info ERROR-mutation-not-applied'; fails=$((fails + 1))
          fi
          git checkout -- e2e/ios_example
          echo '::group::mutate icons-not-tree-shaken'
          if (cd e2e/ios_example && python3 - <<'PY'
          import re
          t = open("BUILD.bazel").read()
          m = re.search(r'flutter_application\(\n    name = "app_flutter_release",\n.*?\n\)\n', t, re.S)
          assert m, "no app_flutter_release call"
          blk = m.group(0)
          def put(attr, value):
              global blk
              new, n = re.subn(r"\n    " + attr + r" = [^\n]*,", "\n    " + attr + " = " + value + ",", blk, count=1)
              assert n == 1, "no " + attr + " on app_flutter_release"
              blk = new
          put("tree_shake_icons", "False")
          open("BUILD.bazel", "w").write(t[:m.start()] + blk + t[m.end():])
          PY
          ); then
            echo '::endgroup::'
            probe icons-not-tree-shaken e2e/ios_example //:verify_ios_release_framework_test fail
          else
            echo '::endgroup::'
            echo 'PROBE-RESULT icons-not-tree-shaken ERROR-mutation-not-applied'; fails=$((fails + 1))
          fi
          git checkout -- e2e/ios_example
          echo '::group::mutate host-platform-snapshot'
          if (cd e2e/ios_example && python3 - <<'PY'
          import glob, re
          hits = 0
          for path in glob.glob("*.bzl"):
              t = open(path).read()
              new, n1 = re.subn(r'\n[ \t]*"//command_line_option:platforms":[ \t]*\[[^\]]*\],?[ \t]*(?=\n)', "", t)
              new, n2 = re.subn(r'\n[ \t]*"//command_line_option:platforms",[ \t]*(?=\n)', "", new)
              if n1 or n2:
                  assert n1 >= 1 and n2 >= 1, (path, n1, n2)
                  open(path, "w").write(new)
                  hits += 1
          assert hits >= 1, "no transition sets //command_line_option:platforms"
          PY
          ); then
            echo '::endgroup::'
            probe host-platform-snapshot e2e/ios_example //:verify_ios_release_framework_test fail
          else
            echo '::endgroup::'
            echo 'PROBE-RESULT host-platform-snapshot ERROR-mutation-not-applied'; fails=$((fails + 1))
          fi
          git checkout -- e2e/ios_example
          echo '::group::mutate twin-obfuscated'
          if (cd e2e/ios_example && python3 - <<'PY'
          import re
          t = open("BUILD.bazel").read()
          keep = ("app_flutter", "app_flutter_second", "app_flutter_release", "app_lib")
          out, hits = [], 0
          for m in re.finditer(r'(?s)flutter_application\(\n    name = "([^"]+)",\n.*?\n\)\n', t):
              if m.group(1) in keep:
                  continue
              blk = m.group(0)
              if "obfuscate = True" in blk:
                  continue
              new = re.sub(r"\n    obfuscate = False,", "\n    obfuscate = True,", blk, count=1)
              if new == blk:
                  new = blk.replace('",\n', '",\n    obfuscate = True,\n', 1)
              out.append((m.start(), m.end(), new))
              hits += 1
          assert hits >= 1, "no un-obfuscated twin application"
          for s, e, new in reversed(out):
              t = t[:s] + new + t[e:]
          open("BUILD.bazel", "w").write(t)
          PY
          ); then
            echo '::endgroup::'
            probe twin-obfuscated e2e/ios_example //:verify_ios_release_framework_test fail
          else
            echo '::endgroup::'
            echo 'PROBE-RESULT twin-obfuscated ERROR-mutation-not-applied'; fails=$((fails + 1))
          fi
          git checkout -- e2e/ios_example
          log="$RUNNER_TEMP/probe-macos-release-app-runs.log"
          set +e
          (cd e2e/plugin_example && bazel test -c opt //:verify_macos_app_test --test_tag_filters= --strategy=TestRunner=standalone --test_output=all && OB="$(bazel info -c opt output_path)" && a="$(find -L "$OB" -path '*-opt*/bin/*_macho/App' -type f | head -1)" && echo "NM macos [$a]" && [ -n "$a" ] && loc="$(nm -a "$a" | awk '{t = (NF >= 3) ? $2 : $1} t !~ /^[A-Z]$/ {n++} END {print n + 0}')" && echo "NM macos locals_or_stabs=$loc exports=[$(nm -gU "$a" | awk '{print $NF}' | sort | tr '\n' ' ')]" && [ "$loc" = 0 ]) > "$log" 2>&1
          rc=$?
          set -e
          cat "$log"
          if [ "$rc" -eq 0 ]; then v=PASS; else v="ERROR-rc$rc"; fi
          echo "PROBE-RESULT macos-release-app-runs $v"
          case "$v" in PASS|DISCRIMINATES) ;; *) fails=$((fails + 1)) ;; esac
          echo '::group::mutate rules-reverted'
          if (cd e2e/ios_example && python3 - <<'PY'
          import os, subprocess
          PRE = "b1159f38207125c2a6683d5ac4d4c3dae7a1f190"
          def git(*a):
              return subprocess.run(["git", *a], check=True, capture_output=True, text=True).stdout
          git("fetch", "-q", "--depth=1", "origin", PRE)
          changed = git("diff", "--name-only", PRE, "HEAD", "--", "../../flutter").split()
          assert changed, "head does not change flutter/"
          added = git("diff", "--name-only", "--diff-filter=A", PRE, "HEAD", "--", "../../flutter").split()
          top = git("rev-parse", "--show-toplevel").strip()
          for f in added:
              os.remove(os.path.join(top, f))
          git("checkout", PRE, "--", "../../flutter")
          print("reverted", changed)
          PY
          ); then
            echo '::endgroup::'
            probe rules-reverted e2e/ios_example //:verify_ios_release_framework_test fail
          else
            echo '::endgroup::'
            echo 'PROBE-RESULT rules-reverted ERROR-mutation-not-applied'; fails=$((fails + 1))
          fi
          git checkout -- e2e/ios_example
          echo "PROBE-SUMMARY failures=$fails"
          [ "$fails" -eq 0 ]
