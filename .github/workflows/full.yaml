name: Full
# Throwaway preflight for COV-10 (iOS coverage stream). Never merged.
on:
  workflow_dispatch:
    inputs:
      uncached:
        description: Unused; kept so the dispatch command matches full.yaml's
        required: false
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  dev-tool-ios:
    name: Dev tool iOS preflight (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          cache-save: false
      - name: Keep one output base per workspace
        run: sed -i '' '/^startup --output_base=/d' ~/.bazelrc || true
      - name: Build the dev tool and put the pinned Dart on PATH
        run: |
          bazel build //tools/dev_tool:flutter_bazel
          d="$(ls -d "$(bazel info output_base)"/external/*flutter+flutter_*/dart-sdk/bin | head -1)"
          "$d/dart" --version
          echo "$d" >> "$GITHUB_PATH"
      - name: Simulator inventory
        run: xcrun simctl list runtimes && xcrun simctl list devices available
      - name: Dev tool iOS e2e
        run: dart run tools/dev_tool/tool/e2e.dart test/e2e/ios_simulator_e2e_test.dart test/e2e/asset_reload_e2e_test.dart test/e2e/plugin_example_e2e_test.dart
