name: Probe
# Throwaway behaviour probes (iOS coverage stream). Never merged; see the manager's ios_cov_probes.py.
on:
  workflow_dispatch:
    inputs:
      uncached:
        description: Unused; kept so the dispatch command matches full.yaml's
        required: false
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  probes:
    name: Behaviour probes (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          cache-save: false
      - name: Keep one output base per workspace
        run: sed -i '' '/^startup --output_base=/d' ~/.bazelrc
      - name: Build the dev tool and put the pinned Dart on PATH
        run: |
          bazel build //tools/dev_tool:flutter_bazel
          d="$(ls -d "$(bazel info output_base)"/external/*flutter+flutter_*/dart-sdk/bin | head -1)"
          "$d/dart" --version
          echo "$d" >> "$GITHUB_PATH"
      - name: Boot an iOS simulator
        run: dart run tools/dev_tool/tool/boot_ios_simulator.dart
      - name: Probes
        run: |
          set -u
          fails=0
          probe() {
            name="$1"; dir="$2"; target="$3"; want="$4"
            log="$RUNNER_TEMP/probe-$name.log"
            set +e
            (cd "$dir" && bazel test "$target" --test_output=errors) > "$log" 2>&1
            rc=$?
            set -e
            cat "$log"
            if [ "$want" = pass ]; then
              if [ "$rc" -eq 0 ]; then v=PASS; else v="ERROR-rc$rc"; fi
            else
              case "$rc" in 3) v=DISCRIMINATES ;; 0) v=BLIND ;; *) v="ERROR-rc$rc" ;; esac
            fi
            echo "PROBE-RESULT $name $v"
            case "$v" in PASS|DISCRIMINATES) ;; *) fails=$((fails + 1)) ;; esac
          }
          log="$RUNNER_TEMP/probe-control-plugin-sim.log"
          set +e
          (cd . && dart run tools/dev_tool/tool/e2e.dart --require-ran=iOS --name='iOS Simulator e2e (plugin_ios renders non-blank frame|every plugin answers on the simulator)' test/e2e/plugin_example_e2e_test.dart) > "$log" 2>&1
          rc=$?
          set -e
          cat "$log"
          if [ "$rc" -eq 0 ]; then v=PASS; else v="ERROR-rc$rc"; fi
          echo "PROBE-RESULT control-plugin-sim $v"
          case "$v" in PASS|DISCRIMINATES) ;; *) fails=$((fails + 1)) ;; esac
          echo '::group::mutate drop-native-frameworks'
          if (cd e2e/plugin_example && python3 - <<'PY'
          t = open("BUILD.bazel").read()
          line = '    ":plugin_ios_native_frameworks",\n'
          assert t.count(line) == 1, "the iOS deps no longer name :plugin_ios_native_frameworks once"
          open("BUILD.bazel", "w").write(t.replace(line, ""))
          PY
          ); then
            echo '::endgroup::'
            log="$RUNNER_TEMP/probe-drop-native-frameworks.log"
            set +e
            (cd . && dart run tools/dev_tool/tool/e2e.dart --require-ran=iOS --name='iOS Simulator e2e (plugin_ios renders non-blank frame|every plugin answers on the simulator)' test/e2e/plugin_example_e2e_test.dart) > "$log" 2>&1
            rc=$?
            set -e
            cat "$log"
            if [ "$rc" -eq 0 ]; then v=BLIND; elif grep -Eq '! iOS Simulator e2e every plugin answers on the simulator \((failure|error)\)' "$log" && grep -Eq '\+ iOS Simulator e2e plugin_ios renders non-blank frame' "$log"; then v=DISCRIMINATES; else v="ERROR-rc$rc-unexpected"; fi
            echo "PROBE-RESULT drop-native-frameworks $v"
            case "$v" in PASS|DISCRIMINATES) ;; *) fails=$((fails + 1)) ;; esac
          else
            echo '::endgroup::'
            echo 'PROBE-RESULT drop-native-frameworks ERROR-mutation-not-applied'; fails=$((fails + 1))
          fi
          git checkout -- e2e/plugin_example
          echo '::group::mutate unregister-url-launcher-ios'
          if (cd e2e/plugin_example && python3 - <<'PY'
          t = open("BUILD.bazel").read()
          old = 'flutter_ios_registrant_gen(\n    name = "plugin_ios_registrant",\n    application = ":plugin_app",\n)\n'
          assert t.count(old) == 1, "no plain plugin_ios_registrant call"
          new = old.replace('":plugin_app",\n', '":plugin_app",\n    exclude_plugins = ["url_launcher_ios"],\n')
          open("BUILD.bazel", "w").write(t.replace(old, new))
          PY
          ); then
            echo '::endgroup::'
            log="$RUNNER_TEMP/probe-unregister-url-launcher-ios.log"
            set +e
            (cd . && dart run tools/dev_tool/tool/e2e.dart --require-ran=iOS --name='iOS Simulator e2e (plugin_ios renders non-blank frame|every plugin answers on the simulator)' test/e2e/plugin_example_e2e_test.dart) > "$log" 2>&1
            rc=$?
            set -e
            cat "$log"
            if [ "$rc" -eq 0 ]; then v=BLIND; elif grep -Eq '! iOS Simulator e2e every plugin answers on the simulator \((failure|error)\)' "$log" && grep -Eq '\+ iOS Simulator e2e plugin_ios renders non-blank frame' "$log"; then v=DISCRIMINATES; else v="ERROR-rc$rc-unexpected"; fi
            echo "PROBE-RESULT unregister-url-launcher-ios $v"
            case "$v" in PASS|DISCRIMINATES) ;; *) fails=$((fails + 1)) ;; esac
          else
            echo '::endgroup::'
            echo 'PROBE-RESULT unregister-url-launcher-ios ERROR-mutation-not-applied'; fails=$((fails + 1))
          fi
          git checkout -- e2e/plugin_example
          echo "PROBE-SUMMARY failures=$fails"
          [ "$fails" -eq 0 ]
