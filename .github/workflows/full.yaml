name: Probe
# Throwaway behaviour probes (iOS coverage stream). Never merged; see the manager's ios_cov_probes.py.
on:
  workflow_dispatch:
    inputs:
      uncached:
        description: Unused; kept so the dispatch command matches full.yaml's
        required: false
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  probes:
    name: Behaviour probes (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          cache-save: false
      - name: Probes
        run: |
          set -u
          fails=0
          probe() {
            name="$1"; dir="$2"; target="$3"; want="$4"
            log="$RUNNER_TEMP/probe-$name.log"
            set +e
            (cd "$dir" && bazel test "$target" --test_output=errors) > "$log" 2>&1
            rc=$?
            set -e
            cat "$log"
            if [ "$want" = pass ]; then
              if [ "$rc" -eq 0 ]; then v=PASS; else v="ERROR-rc$rc"; fi
            else
              case "$rc" in 3) v=DISCRIMINATES ;; 0) v=BLIND ;; *) v="ERROR-rc$rc" ;; esac
            fi
            echo "PROBE-RESULT $name $v"
            case "$v" in PASS|DISCRIMINATES) ;; *) fails=$((fails + 1)) ;; esac
          }
          log="$RUNNER_TEMP/probe-diag-release-binary.log"
          set +e
          (cd e2e/ios_example && bazel build //:app_release_device //:app_release_plain_device && for t in __app_release_framework_framework __app_release_plain_framework_framework; do a=$(find -L bazel-bin -path "*/$t/App.framework/App" -type f | head -1); echo "== $t $a"; [ -n "$a" ] || continue; file "$a"; otool -l "$a" | grep -E -A4 'LC_SYMTAB|LC_DYSYMTAB|LC_DYLD_EXPORTS_TRIE|LC_DYLD_INFO' | head -40; echo '-- nm -gU'; nm -gU "$a" | head -20; echo '-- nm -gU count'; nm -gU "$a" | wc -l; echo '-- nm -a count'; nm -a "$a" | wc -l; echo '-- nm -a MyApp'; nm -a "$a" | grep -m8 MyApp; echo '-- strings MyApp'; strings -a "$a" | grep -m8 MyApp; echo '-- kDart'; nm -a "$a" | grep -m8 kDart; done; echo '-- aquery'; bazel aquery 'mnemonic("FlutterAot.*|Aot.*|GenSnapshot.*", deps(//:app_release_device))' --output=text 2>/dev/null | grep -E 'Mnemonic|snapshot_kind|obfuscate|--strip|save-debugging|dwarf' | head -40; bazel aquery 'deps(//:app_release_device)' --output=text 2>/dev/null | grep -B2 -A40 'AOT compiling' | grep -E 'Mnemonic|  Command Line|obfuscate|strip|snapshot_kind|gen_snapshot' | head -30) > "$log" 2>&1
          rc=$?
          set -e
          cat "$log"
          if [ "$rc" -eq 0 ]; then v=PASS; else v="ERROR-rc$rc"; fi
          echo "PROBE-RESULT diag-release-binary $v"
          case "$v" in PASS|DISCRIMINATES) ;; *) fails=$((fails + 1)) ;; esac
          echo "PROBE-SUMMARY failures=$fails"
          [ "$fails" -eq 0 ]
