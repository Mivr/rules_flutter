name: Probe
# Throwaway behaviour probes (iOS coverage stream). Never merged; see the manager's ios_cov_probes.py.
on:
  workflow_dispatch:
    inputs:
      uncached:
        description: Unused; kept so the dispatch command matches full.yaml's
        required: false
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  probes:
    name: Behaviour probes (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          cache-save: false
      - name: Probes
        run: |
          set -u
          fails=0
          probe() {
            name="$1"; dir="$2"; target="$3"; want="$4"
            log="$RUNNER_TEMP/probe-$name.log"
            set +e
            (cd "$dir" && bazel test "$target" --test_output=errors) > "$log" 2>&1
            rc=$?
            set -e
            cat "$log"
            if [ "$want" = pass ]; then
              if [ "$rc" -eq 0 ]; then v=PASS; else v="ERROR-rc$rc"; fi
            else
              case "$rc" in 3) v=DISCRIMINATES ;; 0) v=BLIND ;; *) v="ERROR-rc$rc" ;; esac
            fi
            echo "PROBE-RESULT $name $v"
            case "$v" in PASS|DISCRIMINATES) ;; *) fails=$((fails + 1)) ;; esac
          }
          probe control-bundle-assets e2e/ios_example //:verify_ios_bundle_assets_test pass
          echo '::group::mutate drop-app-assets'
          if (cd e2e/ios_example && python3 - <<'PY'
          import re
          t = open("BUILD.bazel").read()
          m = re.search(r'flutter_application\(\n    name = "app_flutter",\n.*?\n\)\n', t, re.S)
          assert m, "no app_flutter call"
          blk = m.group(0)

          i = blk.index("\n    assets = ")
          j = re.search(r"\n    [a-z_]+ = |\n\)", blk[i + 1:]).start() + i + 1
          new = blk[:i] + "\n    assets = []," + blk[j:]
          open("BUILD.bazel", "w").write(t[:m.start()] + new + t[m.end():])
          PY
          ); then
            echo '::endgroup::'
            probe drop-app-assets e2e/ios_example //:verify_ios_bundle_assets_test fail
          else
            echo '::endgroup::'
            echo 'PROBE-RESULT drop-app-assets ERROR-mutation-not-applied'; fails=$((fails + 1))
          fi
          git checkout -- e2e/ios_example
          echo '::group::mutate drop-material-icons'
          if (cd e2e/ios_example && python3 - <<'PY'
          import re
          t = open("BUILD.bazel").read()
          m = re.search(r'flutter_application\(\n    name = "app_flutter",\n.*?\n\)\n', t, re.S)
          assert m, "no app_flutter call"
          blk = m.group(0)

          new = re.sub(r'\n\s+"@rules_flutter//flutter:material_icons",', "", blk, count=1)
          assert new != blk, "no material_icons dep in app_flutter"
          open("BUILD.bazel", "w").write(t[:m.start()] + new + t[m.end():])
          PY
          ); then
            echo '::endgroup::'
            probe drop-material-icons e2e/ios_example //:verify_ios_bundle_assets_test fail
          else
            echo '::endgroup::'
            echo 'PROBE-RESULT drop-material-icons ERROR-mutation-not-applied'; fails=$((fails + 1))
          fi
          git checkout -- e2e/ios_example
          probe control-ffi-simulator e2e/ffi_example //:verify_ios_simulator_test pass
          echo '::group::mutate break-native-add'
          if (cd e2e/ffi_example && python3 - <<'PY'
          p = "native/add.c"
          t = open(p).read()
          assert "return a + b;" in t, "add.c changed shape"
          open(p, "w").write(t.replace("return a + b;", "return a + b + 1;"))
          PY
          ); then
            echo '::endgroup::'
            probe break-native-add e2e/ffi_example //:verify_ios_simulator_test fail
          else
            echo '::endgroup::'
            echo 'PROBE-RESULT break-native-add ERROR-mutation-not-applied'; fails=$((fails + 1))
          fi
          git checkout -- e2e/ffi_example
          echo "PROBE-SUMMARY failures=$fails"
          [ "$fails" -eq 0 ]
