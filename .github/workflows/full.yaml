name: Probe
# Throwaway behaviour probes (iOS coverage stream). Never merged; see the manager's ios_cov_probes.py.
on:
  workflow_dispatch:
    inputs:
      uncached:
        description: Unused; kept so the dispatch command matches full.yaml's
        required: false
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  probes:
    name: Behaviour probes (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          cache-save: false
      - name: Probes
        run: |
          set -u
          fails=0
          probe() {
            name="$1"; dir="$2"; target="$3"; want="$4"
            log="$RUNNER_TEMP/probe-$name.log"
            set +e
            (cd "$dir" && bazel test "$target" --test_output=errors) > "$log" 2>&1
            rc=$?
            set -e
            cat "$log"
            if [ "$want" = pass ]; then
              if [ "$rc" -eq 0 ]; then v=PASS; else v="ERROR-rc$rc"; fi
            else
              case "$rc" in 3) v=DISCRIMINATES ;; 0) v=BLIND ;; *) v="ERROR-rc$rc" ;; esac
            fi
            echo "PROBE-RESULT $name $v"
            case "$v" in PASS|DISCRIMINATES) ;; *) fails=$((fails + 1)) ;; esac
          }
          log="$RUNNER_TEMP/probe-diag-release-binary.log"
          set +e
          (cd e2e/ios_example && bazel build //:app_release_device //:app_release_plain_device && OB=$(bazel info output_path 2>/dev/null); echo "output_path $OB"; for t in __app_release_framework_framework __app_release_plain_framework_framework; do a=$(find -L "$OB" -path "*/$t/App.framework/App" -type f 2>/dev/null | head -1); echo "== $t [$a]"; [ -n "$a" ] || continue; d=$(find -L "$OB" -name 'app_flutter_release*.dylib' -type f 2>/dev/null); echo "dylibs: $d"; file "$a"; ls -l "$a"; otool -l "$a" | grep -E -A5 'cmd LC_(SYMTAB|DYSYMTAB|DYLD_EXPORTS_TRIE|DYLD_INFO|ID_DYLIB|SEGMENT_64)' | grep -E 'cmd |segname|nsyms|stroff|strsize|ilocalsym|nlocalsym|iextdefsym|nextdefsym|dataoff|datasize|export_|name ' | head -40; echo '-- nm -gU'; nm -gU "$a" | head -12; echo "-- nm -gU count $(nm -gU "$a" | wc -l)"; echo "-- nm -a count $(nm -a "$a" | wc -l)"; echo '-- nm -a sample'; nm -a "$a" | sed -n '1,6p;3000,3004p'; echo '-- nm -a MyApp'; nm -a "$a" | grep -m8 MyApp; echo '-- strings MyApp'; strings -a -n 4 "$a" | grep -m10 MyApp; echo '-- kDart'; nm -a "$a" | grep -m8 -i snapshot; echo '-- dyld_info exports'; (dyld_info -exports "$a" 2>&1 || true) | head -12; done; for d in $(find -L "$OB" -name 'app_flutter_release*.dylib' -type f 2>/dev/null); do echo "== dylib $d"; nm -gU "$d" | head -8; echo "nm -a count $(nm -a "$d" | wc -l)"; strings -a "$d" | grep -c MyApp; done) > "$log" 2>&1
          rc=$?
          set -e
          cat "$log"
          if [ "$rc" -eq 0 ]; then v=PASS; else v="ERROR-rc$rc"; fi
          echo "PROBE-RESULT diag-release-binary $v"
          case "$v" in PASS|DISCRIMINATES) ;; *) fails=$((fails + 1)) ;; esac
          echo "PROBE-SUMMARY failures=$fails"
          [ "$fails" -eq 0 ]
