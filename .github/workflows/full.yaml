name: Probe
# Throwaway behaviour probes (iOS coverage stream). Never merged; see the manager's ios_cov_probes.py.
on:
  workflow_dispatch:
    inputs:
      uncached:
        description: Unused; kept so the dispatch command matches full.yaml's
        required: false
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  probes:
    name: Behaviour probes (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          cache-save: false
      - name: Probes
        run: |
          set -u
          fails=0
          probe() {
            name="$1"; dir="$2"; target="$3"; want="$4"
            log="$RUNNER_TEMP/probe-$name.log"
            set +e
            (cd "$dir" && bazel test "$target" --test_output=errors) > "$log" 2>&1
            rc=$?
            set -e
            cat "$log"
            if [ "$want" = pass ]; then
              if [ "$rc" -eq 0 ]; then v=PASS; else v="ERROR-rc$rc"; fi
            else
              case "$rc" in 3) v=DISCRIMINATES ;; 0) v=BLIND ;; *) v="ERROR-rc$rc" ;; esac
            fi
            echo "PROBE-RESULT $name $v"
            case "$v" in PASS|DISCRIMINATES) ;; *) fails=$((fails + 1)) ;; esac
          }
          probe control-app-test e2e/integration_ios //:app_test pass
          echo '::group::mutate expected-text'
          if (cd e2e/integration_ios && python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("integration_test/app_test.dart"); s = p.read_text()
          n = re.sub(r"find\.text\((['\"])(.*?)\1", lambda m: f"find.text({m.group(1)}{m.group(2)}-probe{m.group(1)}", s, count=1)
          assert n != s, "no find.text literal"; p.write_text(n)
          PY
          ); then
            echo '::endgroup::'
            probe expected-text e2e/integration_ios //:app_test fail
          else
            echo '::endgroup::'
            echo 'PROBE-RESULT expected-text ERROR-mutation-not-applied'; fails=$((fails + 1))
          fi
          git checkout -- e2e/integration_ios
          echo '::group::mutate drop-asset'
          if (cd e2e/integration_ios && python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("BUILD.bazel"); s = p.read_text()
          i = s.index('name = "app_test"'); j = s.index("\n)", i)
          blk = s[i:j]; n = re.sub(r"\n\s*assets = (\[[^\]]*\]|glob\([^)]*\)),", "", blk, count=1)
          assert n != blk, "no assets attr on app_test"; p.write_text(s[:i] + n + s[j:])
          PY
          ); then
            echo '::endgroup::'
            probe drop-asset e2e/integration_ios //:app_test fail
          else
            echo '::endgroup::'
            echo 'PROBE-RESULT drop-asset ERROR-mutation-not-applied'; fails=$((fails + 1))
          fi
          git checkout -- e2e/integration_ios
          echo '::group::mutate plugin-value'
          if (cd e2e/integration_ios && python3 - <<'PY'
          import re, pathlib
          fs = list(pathlib.Path("ios_greeting_plugin").rglob("*.swift")); assert fs, "no swift"
          done = 0
          for p in fs:
              s = p.read_text(); n = re.sub(r"result\((?!nil)(?!FlutterMethodNotImplemented)([^)]+)\)", r'result(String(describing: \1) + "-probe")', s)
              if n != s: p.write_text(n); done += 1
          assert done, "no result( call"
          PY
          ); then
            echo '::endgroup::'
            probe plugin-value e2e/integration_ios //:app_test fail
          else
            echo '::endgroup::'
            echo 'PROBE-RESULT plugin-value ERROR-mutation-not-applied'; fails=$((fails + 1))
          fi
          git checkout -- e2e/integration_ios
          echo "PROBE-SUMMARY failures=$fails"
          [ "$fails" -eq 0 ]
